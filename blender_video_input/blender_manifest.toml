schema_version = "1.0.0"
id = "blender_video_input"
version = "0.3.1"
name = "Live Video Input"
tagline = "Apply live video or local media to selected mesh objects"
maintainer = "Contributors"
type = "add-on"
blender_version_min = "4.5.0"
blender_version_max = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "macos-x64", "macos-arm64", "linux-x64"]

[permissions]
files = "Read chosen media and runtimes and write local support logs"
network = "Discover and receive NDI video streams"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".git/", "*.zip"]
